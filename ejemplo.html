<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Document</title>
    <link rel="stylesheet" href="estilos.css">
</head>
<body>
    <header class="cinexus-header">
        <div class="header-container">
            <div class="header-left">
                <a href="#" class="logo-marca"><img src="logo.png" aria-label="Logo de la empresa"></a>
                    <div class="logo-diamond-wrapper">
                        <div class="diamond-outer"></div>
                        <div class="diamond-inner"></div>
                    </div>
                    <span class="brand-text">CINE<span>XUS</span></span>
                </a>

                <nav class="main.nav" aria-label="Navegación principal">
                    <a href="#" class="nav-link active">Inicio</a>
                    <a href="#" class="nav-link">Catálogo</a>
                    <a href="#" class="nav-link">Películas</a>
                    <a href="#" class="nav-link">Series</a>
                    <a href="#" class="nav-link">Panel Admin</a>
                </nav>
            </div>

            <div class="header-right">
                
                <div class="search-box">
                    <i class="search-icon"></i>
                    <input type="text" class="search-input" placeholder="Buscar títulos..." aria-label="Buscar películas o series">
                </div>

                <button class="icon-btn" aria-label="Notificaciones">
                    <i class="fa-regular fa-bell"></i>
                    <span class="notification-badge"></span>
                </button>

                <div class="user-avatar" title="Perfil de Usuario">
                    AR
                </div>

                <button class="mobile-menu-btn" aria-label="Abrir menú de navegación">
                    <i class="fa-solid fa-bars"></i>
                </button>
            </div>

    </header>

    <footer>
        <p>&copy; 2026 Cinexus. All rights reserved.</p>
    </footer>
    
</body>
</html>
